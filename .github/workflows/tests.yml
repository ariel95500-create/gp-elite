name: Tests

# Runs the full test suite on every push and pull request.
# Linux covers every supported Python version; Windows is included because it
# only offers the "spawn" start method, the one that parallel islands rely on
# everywhere (a class of bugs that Linux-only CI would never see).

on:
  push:
    paths-ignore:
      - "paper/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"

    env:
      PYTHONHASHSEED: "0"        # reproducible results across interpreters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" || python -m pip install -e . pytest sympy

      - name: Test
        run: python -m pytest tests/ -q -p no:cacheprovider
