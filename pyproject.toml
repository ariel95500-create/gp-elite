[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-elite"
version = "0.8.0"
description = "Genetic-programming symbolic regression: interpretable laws from experimental data, with physical units (pure Python/NumPy)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sabri Hakou", email = "ariel95500@gmail.com"}]
keywords = [
    "symbolic-regression", "genetic-programming", "machine-learning",
    "interpretable-ml", "equation-discovery", "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
test = ["pytest>=7.0", "sympy>=1.9"]

[project.urls]
Homepage = "https://github.com/ariel95500-create/gp-elite"
Repository = "https://github.com/ariel95500-create/gp-elite"
Issues = "https://github.com/ariel95500-create/gp-elite/issues"
Changelog = "https://github.com/ariel95500-create/gp-elite/blob/main/CHANGELOG.md"

[project.scripts]
gp-elite = "gp_elite.cli:main"

# Restreint pytest au dossier tests/. Sans cela pytest ramasse tout fichier
# nomme test_*.py sous la racine, y compris les scripts de validation longs
# de benchmarks/ qui ne sont pas des tests unitaires.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gp_elite"]

[tool.setuptools.package-data]
gp_elite = ["py.typed"]

